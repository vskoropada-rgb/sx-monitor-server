services:
  api:
    build: ./api
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql://monitor:${DB_PASSWORD}@postgres:5432/sx_monitor
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  bot:
    build: ./api
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql://monitor:${DB_PASSWORD}@postgres:5432/sx_monitor
      RUN_MODE: bot
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    networks: [internal]

  postgres:
    image: postgres:15-alpine
    restart: always
    env_file: .env
    environment:
      POSTGRES_DB: sx_monitor
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "monitor", "-d", "sx_monitor"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  grafana:
    image: grafana/grafana:10.4.0
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on: [postgres]
    networks: [internal]

  frontend:
    build: ./frontend
    restart: always
    networks: [internal]

  nginx:
    build: ./nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    # Щоб підставити справжній сертифікат (Let's Encrypt тощо) — розкоментуй
    # і поклади self.crt + self.key у ./nginx/certs на сервері:
    # volumes:
    #   - ./nginx/certs:/etc/nginx/certs:ro
    depends_on: [api, grafana, frontend]
    networks: [internal]

volumes:
  pgdata:
  grafana_data:

networks:
  internal:
    driver: bridge
