load_module /usr/lib/nginx/modules/ngx_http_headers_more_filter_module.so;

events { worker_connections 1024; }

http {
    server_tokens off;
    more_clear_headers 'Server';
    more_clear_headers 'X-Powered-By';

    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=ingest:10m rate=120r/m;

    server {
        listen 80;
        server_name _;

        error_page 400 /err/400.html;
        error_page 403 /err/403.html;
        error_page 404 /err/404.html;
        error_page 500 502 503 504 /err/5xx.html;

        location ^~ /err/ {
            alias /etc/nginx/errors/;
            internal;
        }

        # Внутрішній endpoint бота — НІКОЛИ не з інтернету
        location = /api/auth/login-token {
            return 404;
        }

        location /auth {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass         http://api:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }
        location /api/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass         http://api:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        location /api/metrics {
            limit_req zone=ingest burst=20 nodelay;
            proxy_pass         http://api:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        location /api/ {
            proxy_pass         http://api:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 30s;
        }

        location /health {
            proxy_pass http://api:8000/health;
        }

        location /grafana/ {
            proxy_pass         http://grafana:3000/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        location / {
            proxy_pass         http://frontend:80;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }
    }
}
