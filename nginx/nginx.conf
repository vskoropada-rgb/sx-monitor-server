events { worker_connections 1024; }

http {
    server_tokens off;

    # ─── rate limiting ───────────────────────────────────────────
    # вхід у дашборд: захист від перебору токенів
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    # агенти шлють метрики — щедріше
    limit_req_zone $binary_remote_addr zone=ingest:10m rate=120r/m;

    # HTTP → HTTPS redirect + certbot challenge
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS
    server {
        listen 443 ssl;
        server_name ${DOMAIN};

        ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # базові security-заголовки
        add_header X-Frame-Options        "DENY"            always;
        add_header X-Content-Type-Options "nosniff"         always;
        add_header Referrer-Policy        "same-origin"     always;

        # Внутрішній endpoint бота — НІКОЛИ не з інтернету
        location = /api/auth/login-token {
            return 404;
        }

        # Magic-link landing + auth API — з rate-limit
        location /auth {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass         http://api:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }
        location /api/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass         http://api:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        # Прийом метрик/команд від агентів
        location /api/metrics {
            limit_req zone=ingest burst=20 nodelay;
            proxy_pass         http://api:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        # Решта API (dashboard, commands, status)
        location /api/ {
            proxy_pass         http://api:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 30s;
        }

        location /health {
            proxy_pass http://api:8000/health;
        }

        # Grafana
        location /grafana/ {
            proxy_pass         http://grafana:3000/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        # React-дашборд (SPA)
        location / {
            proxy_pass         http://frontend:80;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }
    }
}
