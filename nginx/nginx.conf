load_module /usr/lib/nginx/modules/ngx_http_headers_more_filter_module.so;

events { worker_connections 1024; }

http {
    server_tokens off;
    more_clear_headers 'Server';
    more_clear_headers 'X-Powered-By';

    # Ліміти тіла й таймаути — захист від oversized payload та slowloris.
    client_max_body_size   1m;
    client_body_timeout    10s;
    client_header_timeout  10s;
    send_timeout           10s;
    keepalive_timeout      30s;

    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=ingest:10m rate=120r/m;

    # ─── HTTP :80 ───────────────────────────────────────────────────────
    # Агентські endpoint-и лишаються на HTTP (існуючі агенти не ламаються).
    # Решта (дашборд, логін, Grafana) → редирект на HTTPS.
    server {
        listen 80;
        server_name _;

        error_page 400 /err/400.html;
        error_page 403 /err/403.html;
        error_page 404 /err/404.html;
        error_page 500 502 503 504 /err/5xx.html;
        location ^~ /err/ { alias /etc/nginx/errors/; internal; }

        # Прийом метрик від агентів
        location /api/metrics {
            limit_req zone=ingest burst=20 nodelay;
            proxy_pass         http://api:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Черга команд для агентів (pending + result)
        location /api/commands {
            proxy_pass         http://api:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Health-check (AWS / моніторинг) — без редиректу
        location /health {
            proxy_pass http://api:8000/health;
        }

        # Усе інше (браузерний трафік) → HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ─── HTTPS :443 ─────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name _;

        ssl_certificate     /etc/nginx/certs/self.crt;
        ssl_certificate_key /etc/nginx/certs/self.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1h;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

        error_page 400 /err/400.html;
        error_page 403 /err/403.html;
        error_page 404 /err/404.html;
        error_page 500 502 503 504 /err/5xx.html;
        location ^~ /err/ { alias /etc/nginx/errors/; internal; }

        # Внутрішній endpoint бота — НІКОЛИ не з інтернету
        location = /api/auth/login-token {
            return 404;
        }

        location /auth {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass         http://api:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
        location /api/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass         http://api:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /api/metrics {
            limit_req zone=ingest burst=20 nodelay;
            proxy_pass         http://api:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass         http://api:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        location /health {
            proxy_pass http://api:8000/health;
        }

        # Grafana має власний фронтенд з inline-скриптами/eval — тут
        # послаблюємо CSP (інакше UI не вантажиться). Решта заголовків — ті самі.
        location /grafana/ {
            proxy_pass         http://grafana:3000/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;

            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
        }

        location / {
            proxy_pass         http://frontend:80;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
