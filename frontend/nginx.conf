server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: будь-який маршрут → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # статика з довгим кешем
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
